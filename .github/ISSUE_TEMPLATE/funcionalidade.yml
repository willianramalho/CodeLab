name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuário do CodeLab isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O usuário consegue...
        - [ ] A API recusa...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [api (Express/Sequelize), frontend (Vue), banco de dados, pipeline/infra, documentação]
    validations:
      required: true
